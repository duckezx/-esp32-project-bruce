; PlatformIO Project Configuration File - Bruce ESP32 OLED SSD1306
;
; Projeto: ESP32 OLED 1306
; Desenvolvedor: @duckezx
; Baseado em: BruceDevices/firmware oficial

[platformio]
default_envs = esp32-oled-ssd1306
build_cache_dir = .pio/buildcache
cache_dir = .pio/cache
boards_dir = boards/_boards_json
extra_configs = boards/*.ini

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
platform_packages =
    framework-arduinoespressif32-libs @ https://github.com/bmorcelli/esp32-arduino-lib-builder/releases/download/idf-release_v5.5/bruce_esp32-arduino-libs-20260123-153546.zip

monitor_filters = esp32_exception_decoder, send_on_enter, colorize
monitor_speed = 115200
framework = arduino
board_build.variants_dir = boards
board_build.filesystem = littlefs

build_src_flags =
	-Wall
	-Wclobbered
	-Wempty-body
	-Wignored-qualifiers
	-Woverloaded-virtual=0
	-Wtype-limits
	-Wno-unused-label
	-Wno-comment
	-Wno-unused-variable
	-Wno-narrowing

build_src_filter =
	+<*>
	-<.git/>
	-<.svn/>

build_flags =
	-DBRUCE_VERSION='"dev-oled"'
	-DEEPROMSIZE=128
	-DLH=8
	-DLW=6
	-flto
	-ffunction-sections
	-fdata-sections
	-Os
	-Wl,--print-memory-usage
	-Wl,--gc-sections
	-DGIT_COMMIT_HASH='"Bruce-OLED"'
	-D CONFIG_ASYNC_TCP_STACK_SIZE=4096
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=1
	-DCONFIG_ASYNC_TCP_USE_WDT=0
	-DMBEDTLS_CONFIG_FILE=\"mbedtls/esp_config.h\"
	-DCONFIG_MBEDTLS_ECDH_C=1
	-DCONFIG_MBEDTLS_AES_C=1
	-DCONFIG_MBEDTLS_CTR_DRBG_C=1

extra_scripts =
	pre:patch.py
	pre:pre_build_current_year.py
	pre:gen_mqjs_headers.py
	pre:patch_library_conflicts.py
	flto_prep.py
	post:build.py

lib_deps =
	https://github.com/sayacom/WireGuard-ESP32-Arduino#feature/esp-netif
	https://github.com/bmorcelli/IRremoteESP8266
	paulstoffregen/Time@1.6.1
	LibSSH-ESP32
	Adafruit BusIO=https://github.com/emericklaw/Adafruit-BusIO_Bruce@1.17.2-bruce.1
	Adafruit PN532=https://github.com/emericklaw/Adafruit-PN532_Bruce@1.3.3-bruce.1
	https://github.com/huckor/BER-TLV.git
	https://github.com/rennancockles/Arduino_MFRC522v2.git
	https://github.com/bmorcelli/ESP-ChameleonUltra
	https://github.com/bmorcelli/ESP-Amiibolink
	https://github.com/rennancockles/SimpleCLI
	https://github.com/whywilson/ESP-PN532BLE
	https://github.com/whywilson/ESP-PN532-UART
	https://github.com/whywilson/ESP-PN532Killer
	NTPClient@3.2.1
	ESP32Time@2.0.6
	FFat
	bblanchon/ArduinoJson
	https://github.com/bmorcelli/rc-switch
	ESP8266Audio@^2.4.1
	earlephilhower/ESP8266SAM@^1.1.0
	mikalhart/TinyGPSPlus
	tinyu-zhao/FFT@^0.0.1
	h2zero/NimBLE-Arduino@2.5
	nrf24/RF24 @ 1.4.11
	Bodmer/JPEGDecoder
	https://github.com/bmorcelli/SmartRC-CC1101-Driver-Lib/
	mquickjs=https://github.com/BruceDevices/mquickjs#0.0.6
	https://github.com/bmorcelli/OneWire#patch-1
	https://github.com/bmorcelli/ESP32-PsRamFS#patch-1
	bitbank2/AnimatedGIF
	bitbank2/PNGdec @ ^1.1.2
	ESP32Async/ESPAsyncWebServer
	fastled/FastLED @^3.10.3
	jgromes/RadioLib @ ^7.4.0
	lovyan03/LovyanGFX @ ^1.2.7

[env:esp32-oled-ssd1306]
board = esp32dev
board_build.partitions = default_16MB.csv
build_src_filter = ${env.build_src_filter} +<../boards/esp32-oled-ssd1306>
build_flags =
	${env.build_flags}
	-Iboards/esp32-oled-ssd1306
	-D DEVICE_NAME='"ESP32 OLED SSD1306"'
	-D HAS_SCREEN=1
	-D HAS_BTN=1
	-D ROTATION=0
	
	; OLED Display Configuration - LovyanGFX
	-D USE_LOVYANGFX=1
	-D LOVYAN_PANEL=Panel_SSD1306
	-D LOVYAN_BUS=Bus_I2C
	-D LOVYAN_I2C_BUS=1
	-D TFT_I2C_PORT=0
	-D TFT_I2C_WRITE=400000
	-D TFT_I2C_READ=400000
	-D TFT_SDA=21
	-D TFT_SCL=22
	-D TFT_ADDR=0x3C
	-D TFT_WIDTH=128
	-D TFT_HEIGHT=64
	
	; Button Configuration
	-D BTN_PIN=0
	-D BTN_ACT=LOW
	-D BTN_ALIAS='"Boot"'
	
	; LED Configuration (Optional)
	-D LED=-1
	-D LED_ON=HIGH
	
	; IR Configuration
	-D IR_TX_PINS='{{"GPIO12", 12}}'
	-D IR_RX_PINS='{{"GPIO14", 14}}'
	-D TXLED=12
	-D RXLED=14
	-D LED_OFF=LOW
	
	; RF Configuration (Optional)
	-D RF_TX_PINS='{{"GPIO5", 5}}'
	-D RF_RX_PINS='{{"GPIO4", 4}}'
	
	; SPI Configuration for RF modules
	-D SPI_SCK_PIN=18
	-D SPI_MOSI_PIN=23
	-D SPI_MISO_PIN=19
	-D SPI_SS_PIN=5
	
	; I2C Configuration (Shared with OLED)
	-D GROVE_SDA=21
	-D GROVE_SCL=22

lib_deps =
	${env.lib_deps}
	lovyan03/LovyanGFX @ ^1.2.7

lib_ignore =
	TFT_eSPI
	M5Unified
