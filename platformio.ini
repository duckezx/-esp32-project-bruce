[platformio]
default_envs = esp32-wroom-ssd1306

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
framework = arduino
board_build.filesystem = littlefs

lib_deps =
    https://github.com/bmorcelli/IRremoteESP8266
    paulstoffregen/Time@1.6.1
    lovyan03/LovyanGFX @ ^1.2.7

[env:esp32-wroom-ssd1306]
board = esp32dev
board_build.partitions = default_16MB.csv
build_flags =
    -D DEVICE_NAME='"ESP32-WROOM SSD1306"'
    -D HAS_SCREEN=1
    -D USE_LOVYANGFX=1
    -D LOVYAN_PANEL=Panel_SSD1306
    -D LOVYAN_BUS=Bus_I2C
    -D LOVYAN_I2C_BUS=1
    -D TFT_I2C_PORT=0
    -D TFT_I2C_WRITE=400000
    -D TFT_I2C_READ=400000
    -D TFT_SDA=21
    -D TFT_SCL=22
    -D TFT_ADDR=0x3C
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=64
